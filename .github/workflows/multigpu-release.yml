name: "multigpu: release"

# Tagged releases of llama.cpp-multigpu: push an annotated tag `multigpu-YYYYMMDD` on the patched branch
# and this workflow builds exactly two Linux x86-64 CUDA flavours, gates them offline, publishes the
# GitHub Release (tarballs + cudart + patches + SHA256SUMS, notes from docs/multigpu/RELEASE-INTRO.md)
# and pushes both runtime images to ghcr.
#
#   cuda-12.9  nvidia/cuda:12.9.1  V100 -> RTX 5090: SASS sm_70/86/89/120a/121a, PTX sm_50/61/70/75/80/90
#   cuda-13.4  nvidia/cuda:13.4.1  Ampere+ only (CUDA 13 cannot target Maxwell/Pascal/Volta):
#                                  SASS sm_86/89/120a/121a, PTX sm_80/90
#
# No schedule, no rolling prerelease, no Windows/CPU artifacts, no PR builds. Regular pushes are handled by
# multigpu-build.yml (sm_86 image only). `runs-on` comes from the MULTIGPU_RUNNER repository variable
# (default GitHub-hosted ubuntu-24.04) so the matrix can move to a self-hosted runner later.

on:
  push:
    tags:
      - 'multigpu-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing multigpu-* tag to build and publish (the release must not exist yet)'
        required: true
        type: string

concurrency:
  group: multigpu-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------------- gate
  gate:
    name: resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            multigpu-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]*) : ;;
            *) echo "::error::tag must look like multigpu-YYYYMMDD[.N], got '$TAG'"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "::error::tag $TAG does not exist"; exit 1; }
          SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
          # Refuse to double-publish; a permanent release is never silently replaced. Re-tag with .N instead.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists; create a new tag (e.g. $TAG.1) instead of re-running"; exit 1
          fi
          echo "tag=$TAG"                 >> "$GITHUB_OUTPUT"
          echo "version=${TAG#multigpu-}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"                 >> "$GITHUB_OUTPUT"
          {
            echo "### Release gate"
            echo "- event: \`$EVENT\`, tag: \`$TAG\` -> \`$SHA\`"
            echo "- flavours: cuda-12.9 (V100 -> RTX 5090) and cuda-13.4 (Ampere+)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- the two CUDA builds
  # No GPU is needed to compile: nvcc cross-compiles SASS for the "-real" entries and PTX for the
  # "-virtual" ones. GGML_NATIVE stays OFF (it means "GPUs present at build time", none here).
  build:
    name: build ${{ matrix.flavour }}
    needs: gate
    runs-on: ${{ vars.MULTIGPU_RUNNER || 'ubuntu-24.04' }}
    container:
      image: ${{ matrix.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: cuda-12.9
            image: nvidia/cuda:12.9.1-devel-ubuntu24.04
            cuda: '12.9'
            cuda_full: '12.9.1'
            # ggml's default list for CUDA 12.9 plus 70-real (native Volta code for V100 boxes).
            arch_list: '50-virtual;61-virtual;70-virtual;70-real;75-virtual;80-virtual;86-real;89-real;90-virtual;120a-real;121a-real'
            expect_sass: 'sm_70,sm_86,sm_89,sm_120a,sm_121a'
            expect_ptx: 'sm_50,sm_61,sm_70,sm_75,sm_80,sm_90'
            driver_floor: 'R525+ (native targets); R570+ for Blackwell; R575+ for the PTX-only GPUs (CUDA 12.9 PTX JIT)'
          - flavour: cuda-13.4
            image: nvidia/cuda:13.4.1-devel-ubuntu24.04
            cuda: '13.4'
            cuda_full: '13.4.1'
            # Ampere and newer only: CUDA 13 removed Maxwell/Pascal/Volta, and Turing is left out on purpose.
            arch_list: '80-virtual;86-real;89-real;90-virtual;120a-real;121a-real'
            expect_sass: 'sm_86,sm_89,sm_120a,sm_121a'
            expect_ptx: 'sm_80,sm_90'
            driver_floor: 'R580+ (CUDA 13); a driver as new as CUDA 13.4 for the PTX-only GPUs'
    env:
      DEBIAN_FRONTEND: noninteractive
      ARCH_LIST: ${{ matrix.arch_list }}
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      # git must exist BEFORE actions/checkout runs: without it the action downloads a tarball through the
      # REST API and leaves no .git, and build-info.sh (provenance) and cmake's build number need the repo.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ccache libssl-dev libgomp1 jq curl ca-certificates binutils python3
          # ${{ github.workspace }} is the HOST path in container jobs; $GITHUB_WORKSPACE is the container path.
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - name: ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: multigpu-release-${{ matrix.flavour }}-${{ needs.gate.outputs.sha }}
          restore-keys: |
            multigpu-release-${{ matrix.flavour }}-

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_OPENSSL=ON \
            -DCMAKE_CUDA_ARCHITECTURES="$ARCH_LIST" \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Build metadata
        run: |
          CFG="$(grep -hE '^(GGML|LLAMA|CMAKE_CUDA_ARCH|CMAKE_BUILD_TYPE)[A-Z_]*:' build/CMakeCache.txt | tr '\n' ';' | sed 's/;$//')"
          for fmt in json text; do
            scripts/multigpu/build-info.sh --platform linux-x64 --backend "${{ matrix.flavour }}" \
              --cuda-version "${{ matrix.cuda_full }}" --cuda-arch "$ARCH_LIST" \
              --cuda-sass "${{ matrix.expect_sass }}" --cuda-ptx "${{ matrix.expect_ptx }}" \
              --driver-floor "${{ matrix.driver_floor }}" --cmake-config "$CFG" --format "$fmt" \
              > "build/bin/BUILD_INFO.$([ "$fmt" = json ] && echo json || echo txt)"
          done
          cat build/bin/BUILD_INFO.txt
          cp build/bin/BUILD_INFO.json "BUILD_INFO-${{ matrix.flavour }}.json"

      - name: Package binaries
        run: |
          NAME="llama.cpp-multigpu-${VERSION}-bin-ubuntu-${{ matrix.flavour }}-x64"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p "pkg/$NAME"
          cp -a build/bin/. "pkg/$NAME/"
          cp LICENSE AUTHORS "pkg/$NAME/"
          printf '# llama.cpp-multigpu %s (%s)\n\nllama.cpp + the multigpu performance patchset. BUILD_INFO.json / BUILD_INFO.txt name the\nexact multigpu and upstream llama.cpp revisions, the CUDA toolkit and the device architectures\nin this archive. Driver: %s.\nRun: ./llama-server ... (the libggml*/libllama*.so next to the binaries are found via $ORIGIN).\nProject and documentation: https://github.com/%s#readme\n' \
            "$TAG" "${{ matrix.flavour }}" "${{ matrix.driver_floor }}" "$GITHUB_REPOSITORY" > "pkg/$NAME/README-MULTIGPU.md"
          tar -C pkg -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" | tee "$NAME.tar.gz.sha256"
          size_bytes=$(stat -c %s "$NAME.tar.gz")
          echo "asset size: $size_bytes bytes"
          if [ "$size_bytes" -gt 1900000000 ]; then
            echo "::error::asset exceeds the ~2 GB per-file release limit; trim CMAKE_CUDA_ARCHITECTURES"; exit 1
          fi

      - name: Package CUDA runtime libraries (cudart + cuBLAS of this toolkit)
        run: |
          mkdir -p cudart
          for pat in libcudart.so libcublas.so libcublasLt.so libnvJitLink.so; do
            find /usr/local/cuda*/lib64 /usr/local/cuda*/targets/*/lib -maxdepth 1 -name "${pat}*" -exec cp -P {} cudart/ \; 2>/dev/null || true
          done
          ls -la cudart
          # Completeness: with the archive dir + cudart on the path, only the driver library may be unresolved.
          missing="$(LD_LIBRARY_PATH="$PWD/cudart:$PWD/pkg/$NAME" ldd "pkg/$NAME/libggml-cuda.so" | grep 'not found' | grep -v 'libcuda\.so\.1' || true)"
          if [ -n "$missing" ]; then echo "::error::cudart bundle incomplete:"; echo "$missing"; exit 1; fi
          CNAME="llama.cpp-multigpu-${VERSION}-cudart-ubuntu-${{ matrix.flavour }}-x64"
          mkdir -p "pkgc/$CNAME" && cp -P cudart/* "pkgc/$CNAME/"
          tar -C pkgc -czf "$CNAME.tar.gz" "$CNAME"
          sha256sum "$CNAME.tar.gz" | tee "$CNAME.tar.gz.sha256"

      - name: Tier A gate (offline; SASS + PTX really embedded, flags wired, commit matches)
        run: |
          scripts/multigpu/validate-artifact.sh \
            --archive "$NAME.tar.gz" \
            --expect-arch "${{ matrix.expect_sass }}" \
            --expect-ptx "${{ matrix.expect_ptx }}" \
            --expect-commit "${{ needs.gate.outputs.sha }}"

      - name: Upload release candidates
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.flavour }}
          path: |
            llama.cpp-multigpu-*.tar.gz
            llama.cpp-multigpu-*.tar.gz.sha256
            BUILD_INFO-${{ matrix.flavour }}.json
          retention-days: 7
          if-no-files-found: error

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

  # ------------------------------------------------------------------- patch export
  patches:
    name: export patch series
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - name: format-patch
        run: |
          scripts/multigpu/export-patches.sh --out patches
          tar -czf "llama.cpp-multigpu-${{ needs.gate.outputs.version }}-patches.tar.gz" patches
          sha256sum "llama.cpp-multigpu-${{ needs.gate.outputs.version }}-patches.tar.gz" > "llama.cpp-multigpu-${{ needs.gate.outputs.version }}-patches.tar.gz.sha256"
          echo "### Patches in this release" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,60p' patches/PATCHES.md >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: release-patches
          path: llama.cpp-multigpu-*-patches.tar.gz*
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ publish release
  release:
    name: publish GitHub Release
    needs: [gate, build, patches]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Asset manifest from the per-flavour metadata
        run: |
          mkdir -p meta && mv assets/BUILD_INFO-*.json meta/
          ls -l assets meta
          : > manifest.tsv
          for j in meta/BUILD_INFO-*.json; do
            flav="$(basename "$j" .json | sed 's/^BUILD_INFO-//')"
            cuda="$(jq -r .cuda_toolkit_version "$j")"
            sass="$(jq -r .cuda_sass "$j" | sed 's/,/, /g')"
            ptx="$(jq -r .cuda_ptx "$j" | sed 's/,/, /g')"
            driver="$(jq -r .driver_floor "$j")"
            case "$flav" in
              cuda-12.9) val='Tier A passed; Tier B (sm_86, 6 x RTX 3090) by the maintainer' ;;
              *)         val='Tier A passed; not runtime-validated by us' ;;
            esac
            for f in assets/*-bin-ubuntu-${flav}-x64.tar.gz; do
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$(basename "$f")" "$flav" "$cuda" "$sass" "$ptx" "$driver" "$val" >> manifest.tsv
            done
            for f in assets/*-cudart-ubuntu-${flav}-x64.tar.gz; do
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$(basename "$f")" "$flav" "$cuda" "runtime libraries only" "-" "$driver" "-" >> manifest.tsv
            done
          done
          for f in assets/*-patches.tar.gz; do
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$(basename "$f")" "source" "-" "git format-patch series" "-" "-" "-" >> manifest.tsv
          done
          column -t -s $'\t' manifest.tsv

      - name: Checksums
        run: |
          cd assets && rm -f *.sha256
          sha256sum *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
          cp ../meta/BUILD_INFO-*.json .

      - name: Release notes
        run: |
          scripts/multigpu/release-notes.sh \
            --intro docs/multigpu/RELEASE-INTRO.md \
            --meta meta \
            --assets-manifest manifest.tsv \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY" > notes.md
          wc -c notes.md
          sed -n '1,60p' notes.md

      - name: Publish
        run: |
          set -euo pipefail
          TITLE="llama.cpp-multigpu ${TAG#multigpu-} — Qwen3.8-Flash-Next multi-GPU performance build"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TITLE" --notes-file notes.md \
            assets/*
          {
            echo "### Published"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- assets:"; ls assets | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- runtime images -> ghcr
  images:
    name: image server-${{ matrix.flavour }} -> ghcr
    needs: [gate, build, release]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: cuda-12.9
            cuda_full: '12.9.1'
            latest: true
          - flavour: cuda-13.4
            cuda_full: '13.4.1'
            latest: false
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          sparse-checkout: .devops/multigpu-cuda.Dockerfile
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.flavour }}
          path: incoming

      - name: Build context from the released archive
        run: |
          mkdir -p ctx
          tar -xzf incoming/*-bin-ubuntu-${{ matrix.flavour }}-x64.tar.gz -C ctx
          mv ctx/llama.cpp-multigpu-* ctx/bin
          cp .devops/multigpu-cuda.Dockerfile ctx/Dockerfile

      - name: Build, smoke, push
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLAVOUR: ${{ matrix.flavour }}
          LATEST: ${{ matrix.latest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')"
          SHORT="server-${FLAVOUR/-/}"            # cuda-12.9 -> server-cuda12.9
          TAGS=("$IMAGE:$SHORT-$VERSION" "$IMAGE:$SHORT")
          [ "$LATEST" != "true" ] || TAGS+=("$IMAGE:latest")
          args=(); for t in "${TAGS[@]}"; do args+=(-t "$t"); done
          docker build -f ctx/Dockerfile \
            --build-arg CUDA_VERSION="${{ matrix.cuda_full }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg APP_VERSION="$TAG" \
            --build-arg APP_REVISION="${{ needs.gate.outputs.sha }}" \
            --build-arg IMAGE_SOURCE="https://github.com/$GITHUB_REPOSITORY" \
            "${args[@]}" ctx
          docker run --rm "${TAGS[0]}" --version
          missing="$(docker run --rm --entrypoint sh "${TAGS[0]}" -c 'ldd /app/llama-server /app/*.so 2>/dev/null | grep "not found" | grep -v libcuda.so.1 || true')"
          if [ -n "$missing" ]; then echo "::error::unresolved libraries in the image:"; echo "$missing"; exit 1; fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          for t in "${TAGS[@]}"; do docker push "$t"; done
          { echo "### Images ($FLAVOUR)"; for t in "${TAGS[@]}"; do echo "- \`$t\`"; done; } >> "$GITHUB_STEP_SUMMARY"
