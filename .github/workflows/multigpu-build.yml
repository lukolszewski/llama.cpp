name: "multigpu: build"

# Every push to the patched branch: one CUDA build for the hardware this fork is measured on (RTX 3090,
# sm_86), the upstream test suite, the offline packaging gate, and a runtime image pushed to ghcr.
#
#   ghcr.io/<owner>/llama.cpp-multigpu:server-cuda12.9-sm86          (moving: latest push to `multigpu`)
#   ghcr.io/<owner>/llama.cpp-multigpu:server-cuda12.9-sm86-<sha7>   (immutable)
#
# No pull_request trigger by design (no PR gate on this fork). No tarball releases from here: the
# two-flavour release matrix lives in multigpu-release.yml and runs on `multigpu-*` tags only.
#
# MULTIGPU:PATCHED_BRANCH - the branch name is literal in `on:` (GitHub allows no expressions there).
# `runs-on` comes from the MULTIGPU_RUNNER repository variable so the build can move to a self-hosted
# runner (label set) without editing this file; default = GitHub-hosted ubuntu-24.04.

on:
  push:
    branches:
      - multigpu # MULTIGPU:PATCHED_BRANCH
    paths-ignore:
      - 'docs/**'
      - 'benches/**'
      - 'scripts/multigpu/bench/**'   # benchmark/plot tooling, not part of the build
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/multigpu-release.yml'
      - '.github/workflows/multigpu-selfhosted.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch or SHA). Empty = the pushed/default branch.'
        required: false
        default: ''
        type: string
      push_image:
        description: 'Push the resulting image to ghcr (moving -sm86 tag only when building the patched branch)'
        required: false
        default: true
        type: boolean

concurrency:
  group: multigpu-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CUDA_IMAGE: nvidia/cuda:12.9.1-devel-ubuntu24.04
  CUDA_VERSION: '12.9.1'
  CUDA_SHORT: '12.9'
  ARCH_LIST: '86-real'
  EXPECT_SASS: 'sm_86'

jobs:
  # ------------------------------------------------------------- build + test + gate
  # No GPU is needed to compile CUDA: nvcc cross-compiles to SASS for CMAKE_CUDA_ARCHITECTURES.
  # GGML_NATIVE must stay OFF ("native" = the GPUs present at build time; CI has none).
  build-sm86:
    name: linux-cuda 12.9 sm_86 (build, ctest, Tier A gate)
    runs-on: ${{ vars.MULTIGPU_RUNNER || 'ubuntu-24.04' }}
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu24.04
      options: --user root
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      archive: ${{ steps.meta.outputs.archive }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # git must exist BEFORE actions/checkout runs: without it the action downloads a tarball through the
      # REST API and leaves no .git, and build-info.sh (provenance) and cmake's build number need the repo.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git git-lfs ccache libssl-dev libgomp1 jq curl ca-certificates binutils python3
          git lfs install   # test-tokenizers-ggml-vocabs clones ggml-org/vocabs, whose .gguf files are LFS objects
          # ${{ github.workspace }} is the HOST path in container jobs; $GITHUB_WORKSPACE is the container path.
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: multigpu-cuda${{ env.CUDA_SHORT }}-sm86-${{ github.sha }}
          restore-keys: |
            multigpu-cuda${{ env.CUDA_SHORT }}-sm86-

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_OPENSSL=ON \
            -DCMAKE_CUDA_ARCHITECTURES="$ARCH_LIST" \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Test (upstream suite, label main; test-backend-ops skipped - no GPU here)
        run: ctest --test-dir build -L main -E 'test-backend-ops' --timeout 900 --output-on-failure

      - name: Build metadata
        id: meta
        run: |
          SHORT="$(git rev-parse --short=7 HEAD)"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          NAME="llama.cpp-multigpu-${SHORT}-bin-ubuntu-cuda-${CUDA_SHORT}-x64"
          echo "archive=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          CFG="$(grep -hE '^(GGML|LLAMA|CMAKE_CUDA_ARCH|CMAKE_BUILD_TYPE)[A-Z_]*:' build/CMakeCache.txt | tr '\n' ';' | sed 's/;$//')"
          for fmt in json text; do
            scripts/multigpu/build-info.sh --platform linux-x64 --backend "cuda-${CUDA_SHORT}" \
              --cuda-version "$CUDA_VERSION" --cuda-arch "$ARCH_LIST" --cuda-sass "$EXPECT_SASS" --cuda-ptx none \
              --driver-floor "R525+ (sm_86 native code only)" --cmake-config "$CFG" --format "$fmt" \
              > "build/bin/BUILD_INFO.$([ "$fmt" = json ] && echo json || echo txt)"
          done
          cat build/bin/BUILD_INFO.txt

      - name: Package (tests and their data are not shipped)
        run: |
          rm -f build/bin/test-* build/bin/*.gguf
          mkdir -p "pkg/$NAME"
          cp -a build/bin/. "pkg/$NAME/"
          cp LICENSE AUTHORS "pkg/$NAME/"
          printf '# llama.cpp-multigpu\n\nCI build (not a release). BUILD_INFO.json / BUILD_INFO.txt name the exact multigpu and\nupstream llama.cpp revisions. Project: https://github.com/%s#readme\n' "$GITHUB_REPOSITORY" > "pkg/$NAME/README-MULTIGPU.md"
          tar -C pkg -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" | tee "$NAME.tar.gz.sha256"
          du -h "$NAME.tar.gz"

      - name: Tier A gate (offline; cuobjdump from the devel image)
        run: |
          scripts/multigpu/validate-artifact.sh \
            --archive "$NAME.tar.gz" \
            --expect-arch "$EXPECT_SASS" --expect-no-ptx \
            --expect-commit "$(git rev-parse HEAD)"

      - name: Upload build (kept 14 days; releases come from multigpu-release.yml)
        uses: actions/upload-artifact@v6
        with:
          name: bin-ubuntu-cuda-${{ env.CUDA_SHORT }}-sm86
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

  # ------------------------------------------------------------- runtime image -> ghcr
  image-sm86:
    name: image server-cuda12.9-sm86 -> ghcr
    needs: build-sm86
    runs-on: ubuntu-24.04
    env:
      SHORT_SHA: ${{ needs.build-sm86.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: .devops/multigpu-cuda.Dockerfile
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: bin-ubuntu-cuda-${{ env.CUDA_SHORT }}-sm86
          path: incoming

      - name: Build context from the validated archive
        run: |
          mkdir -p ctx
          tar -xzf incoming/*.tar.gz -C ctx
          mv ctx/llama.cpp-multigpu-* ctx/bin
          cp .devops/multigpu-cuda.Dockerfile ctx/Dockerfile
          ls ctx/bin | head -50

      - name: Image name
        id: img
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # The moving tag follows the patched branch only; dispatches of other refs get the immutable tag alone.
          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ] && [ -z "${{ inputs.ref }}" ]; then
            echo "moving=$IMAGE:server-cuda${CUDA_SHORT}-sm86" >> "$GITHUB_OUTPUT"
          else
            echo "moving=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        run: |
          docker build \
            -f ctx/Dockerfile \
            --build-arg CUDA_VERSION="$CUDA_VERSION" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg APP_VERSION="$SHORT_SHA" \
            --build-arg APP_REVISION="${{ github.sha }}" \
            --build-arg IMAGE_SOURCE="https://github.com/$GITHUB_REPOSITORY" \
            -t "${{ steps.img.outputs.image }}:server-cuda${CUDA_SHORT}-sm86-${SHORT_SHA}" \
            ${{ steps.img.outputs.moving && format('-t {0}', steps.img.outputs.moving) || '' }} \
            ctx

      - name: Smoke (binary runs in the runtime image, all libraries except the driver resolve)
        run: |
          IMG="${{ steps.img.outputs.image }}:server-cuda${CUDA_SHORT}-sm86-${SHORT_SHA}"
          docker run --rm "$IMG" --version
          missing="$(docker run --rm --entrypoint sh "$IMG" -c 'ldd /app/llama-server /app/*.so 2>/dev/null | grep "not found" | grep -v libcuda.so.1 || true')"
          if [ -n "$missing" ]; then echo "::error::unresolved libraries in the image:"; echo "$missing"; exit 1; fi
          echo "all libraries resolve inside the image (libcuda.so.1 comes from the host driver)"
          docker image inspect "$IMG" --format 'size: {{.Size}} bytes'

      - name: Login to ghcr
        if: ${{ github.event_name == 'push' || inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: ${{ github.event_name == 'push' || inputs.push_image }}
        run: |
          docker push "${{ steps.img.outputs.image }}:server-cuda${CUDA_SHORT}-sm86-${SHORT_SHA}"
          [ -z "${{ steps.img.outputs.moving }}" ] || docker push "${{ steps.img.outputs.moving }}"
          {
            echo "### Image"
            echo "- \`${{ steps.img.outputs.image }}:server-cuda${CUDA_SHORT}-sm86-${SHORT_SHA}\`"
            [ -z "${{ steps.img.outputs.moving }}" ] || echo "- \`${{ steps.img.outputs.moving }}\` (moving)"
            echo "- CUDA ${CUDA_VERSION}, SASS sm_86 only; tarball kept 14 days as a CI artifact; releases: multigpu-release.yml"
          } >> "$GITHUB_STEP_SUMMARY"
